name: bootstrap-recovery-kit

on:
  push:
    branches: [phase-1.2-database-kit-tests]
    paths:
      - '.recovery-kit/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify archive transport and install exact kit
        shell: bash
        run: |
          set -euo pipefail

          cat .recovery-kit/chunk_* > /tmp/prepmeds-recovery-kit.b64
          base64 --decode /tmp/prepmeds-recovery-kit.b64 > /tmp/prepmeds-recovery-kit.zip
          echo '08d24cb28a66680bcc63ffbb8b12607c604b8e25fc3335738b8791f8aba9ba09  /tmp/prepmeds-recovery-kit.zip' | sha256sum -c -

          rm -rf /tmp/prepmeds-recovery
          mkdir -p /tmp/prepmeds-recovery
          unzip -q /tmp/prepmeds-recovery-kit.zip -d /tmp/prepmeds-recovery
          root=/tmp/prepmeds-recovery/prepmeds-recovery-kit

          mkdir -p supabase tools data docs/recovery
          cp -a "$root/supabase/." supabase/
          cp -a "$root/tools/." tools/
          cp -a "$root/data/." data/
          cp -a "$root/docs/recovery/." docs/recovery/

          echo '4bfa536e36b87d51980a8e0e1ee36feccd750aca13c6cb6cca1e6197ba8e40ef  supabase/migrations/20261110000000_prepmeds_core.sql' | sha256sum -c -
          echo '8b6a71fcf1b0c98bbae9c5ee3a43fed051cba80526f0d858a9b0a9e76a41cbc2  supabase/migrations/20261110000100_prepmeds_api.sql' | sha256sum -c -

          rm -f supabase/migrations/20261108234000_agent_custody_ledger.sql
          rm -rf .recovery-kit
          rm -f .github/workflows/bootstrap-recovery-kit.yml

      - name: Create immutable archive tag
        shell: bash
        run: |
          set -euo pipefail
          tag='archive/sprint-20261108'
          target='dbf7cccdf58be1fbacfb20d098d8fff8692abe78'
          git fetch origin test/medication-research-regression-20261106 --tags
          test "$(git rev-parse origin/test/medication-research-regression-20261106)" = "$target"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-parse "$tag^{}")" = "$target"
            test "$(git cat-file -t "$tag")" = tag
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$target" -m 'Archive medication research sprint at dbf7ccc before PREP-MEDS database recovery'
            git push origin "refs/tags/$tag"
          fi

      - name: Commit installed kit and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No changes staged'; exit 1; } || true
          git commit -m 'feat(db): add authoritative PREP-MEDS recovery schema and tests'
          git push origin HEAD:phase-1.2-database-kit-tests
