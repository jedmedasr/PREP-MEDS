name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate schemas
        run: pnpm validate:schemas
      - name: Typecheck
        run: pnpm typecheck
      - name: Record CI source identity
        run: node scripts/ci-source-receipt.mjs
      - name: Isolated inhaled-insulin regression tests
        run: pnpm --filter @prep-meds/web exec vitest run lib/__tests__/diabetes-afrezza.test.ts lib/__tests__/diabetes-afrezza-generic-identity.test.ts
      - name: Unit and regression tests
        run: pnpm test
      - name: Build clinical web application
        run: pnpm build:web
