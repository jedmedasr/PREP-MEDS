name: clinical-evidence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-source-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source verification and fail-closed regressions
        run: node --test scripts/__tests__/clinical-evidence*.test.mjs
      - name: Reproduce synthetic revision-to-instruction workflow
        run: |
          mkdir -p evidence-output
          node --input-type=module <<'JS'
          import { runDemo } from './scripts/clinical-evidence/demo.mjs';
          import { writeFileSync } from 'node:fs';
          const r = await runDemo();
          writeFileSync('evidence-output/synthetic-acceptance.json', JSON.stringify(r, null, 2) + '\n');
          writeFileSync('evidence-output/synthetic-bundle.json', JSON.stringify({notice:r.demonstration,records:r.records,inventory:r.inventory,patient:r.patient,currentHashes:r.currentHashes}) + '\n');
          console.log(JSON.stringify({status:r.verification.status,revision:r.revisionDetected,versions:r.preservedVersions,affected:r.affected.length,unchangedCalls:r.unchangedSourceCalls,modelCalls:r.modelCalls}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evidence-acceptance-${{ github.run_id }}
          path: evidence-output
          retention-days: 30
          if-no-files-found: error
