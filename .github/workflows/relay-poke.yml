name: relay-poke

on:
  push:
    branches: [lane/odd]
    paths:
      - 'requests/*.json'

permissions:
  actions: write
  contents: read

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch trusted main relay
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prepmeds-ci.yml --repo "${{ github.repository }}" --ref main -f lane=odd
