name: lane-b-evidence
on:
  pull_request:
    paths:
      - 'docs/medication-evidence/**'
      - 'docs/clinical-evidence/lane-b/**'
      - 'apps/web/tests/lane-b-*.test.ts'
      - 'scripts/lane-b/**'
      - 'scripts/__tests__/lane-b-*.test.mjs'
      - '.github/workflows/lane-b-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-lane-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact source-bound scenario regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lane-b-artifacts
          node --test scripts/__tests__/lane-b-*.test.mjs | tee lane-b-artifacts/tests.tap
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install workspace for actual terminology inheritance tests
        run: pnpm install --no-frozen-lockfile
      - name: Execute actual canonical-ID and alias mapping tests
        run: pnpm --filter @prep-meds/web exec vitest run tests/lane-b-bucket02-mapping.test.ts --reporter=json --outputFile=../../lane-b-artifacts/mapping-tests.json
      - name: Export immutable evidence test receipt
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/lane-b/test-receipt.mjs
      - name: Preserve exact source and original allocated inventory
        if: always()
        run: |
          mkdir -p lane-b-artifacts
          git rev-parse HEAD > lane-b-artifacts/checkout-sha.txt
          git archive --format=tar.gz --output=lane-b-artifacts/source.tar.gz HEAD
          cp docs/medication-audit-manifest.json lane-b-artifacts/allocated-manifest.json
          cp docs/parallel-clinical-buckets-2026-11-08.md lane-b-artifacts/allocation.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-b-evidence-${{ github.run_id }}
          path: lane-b-artifacts
          retention-days: 30
          if-no-files-found: error
