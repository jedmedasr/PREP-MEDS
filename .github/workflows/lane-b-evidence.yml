name: lane-b-evidence
on:
  pull_request:
    paths:
      - 'docs/medication-evidence/**'
      - 'docs/clinical-evidence/lane-b/**'
      - 'scripts/lane-b/**'
      - 'scripts/__tests__/lane-b-*.test.mjs'
      - '.github/workflows/lane-b-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-lane-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Lane B scenario tests when present
        run: |
          mkdir -p lane-b-artifacts
          if ls scripts/__tests__/lane-b-*.test.mjs >/dev/null 2>&1; then
            node --test scripts/__tests__/lane-b-*.test.mjs | tee lane-b-artifacts/tests.tap
          else
            printf 'Input capture only; no evidence completion claimed.\n' > lane-b-artifacts/capture-only.txt
          fi
      - name: Archive exact allocated source without regenerating inventory
        if: always()
        run: |
          git rev-parse HEAD > lane-b-artifacts/checkout-sha.txt
          git archive --format=tar.gz --output=lane-b-artifacts/source.tar.gz HEAD
          cp docs/medication-audit-manifest.json lane-b-artifacts/allocated-manifest.json
          cp docs/parallel-clinical-buckets-2026-11-08.md lane-b-artifacts/allocation.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-b-evidence-${{ github.run_id }}
          path: lane-b-artifacts
          retention-days: 30
          if-no-files-found: error
